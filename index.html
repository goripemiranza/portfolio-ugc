<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio Roblox</title>
  <meta name="description" content="Portfolio Roblox : UGC, Galerie, Commissions." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <div class="brandText">
          <div class="brandTitle">Portfolio Roblox</div>
          <div class="brandSub">UGC • Galerie • Commissions</div>
        </div>
      </div>

      <div class="nav">
        <button class="tabBtn active" type="button" data-view="ugc">UGC</button>
        <button class="tabBtn" type="button" data-view="gallery">Galerie</button>
        <button class="tabBtn" type="button" data-view="commissions">Commissions</button>
        <button class="actionBtn" id="btnRefresh" type="button">Actualiser</button>
      </div>
    </header>

    <main class="views">

      <!-- VIEW: UGC -->
      <section class="view active" id="view-ugc">
        <div class="card">
          <div class="cardHead">
            <div>
              <h2 class="h2">Podium</h2>
              <div class="muted">Les 3 derniers UGC en vente.</div>
            </div>
            <div class="muted" id="podiumHint">—</div>
          </div>

          <div class="podiumRow" id="podiumRow"></div>
          <div class="empty muted" id="podiumEmpty" hidden>Aucun item.</div>
        </div>

        <div class="card">
          <div class="filtersGrid">
            <div class="control">
              <div class="label">Catégorie</div>
              <select id="fCategory" aria-label="Catégorie"></select>
            </div>
            <div class="control">
              <div class="label">Type</div>
              <select id="fType" aria-label="Type"></select>
            </div>
            <div class="control">
              <div class="label">Tri</div>
              <select id="fSort" aria-label="Tri">
                <option value="new">Plus récents</option>
                <option value="old">Plus anciens</option>
                <option value="fav">Favoris ↓</option>
                <option value="price_desc">Prix ↓</option>
                <option value="price_asc">Prix ↑</option>
              </select>
            </div>
            <div class="control">
              <div class="label">Recherche</div>
              <input id="fSearch" type="search" placeholder="Nom / ID…" autocomplete="off" />
            </div>
          </div>
        </div>

        <div class="sectionHead">
          <h2 class="h2">Tous les UGC</h2>
          <div class="muted" id="ugcCount">—</div>
        </div>

        <div class="ugcGrid" id="ugcGrid"></div>
        <div class="empty muted" id="ugcEmpty" hidden>Aucun résultat.</div>

        <div class="footInfo muted" id="updateInfo"></div>
      </section>

      <!-- VIEW: GALLERY -->
      <section class="view" id="view-gallery">
        <div class="card">
          <div class="cardHead">
            <div>
              <h2 class="h2">Galerie</h2>
              <div class="muted">Images uniquement.</div>
            </div>
            <div class="muted" id="galleryCount">—</div>
          </div>

          <div class="galleryGrid" id="galleryGrid"></div>
          <div class="empty muted" id="galleryEmpty" hidden>Aucune image.</div>
        </div>
      </section>

      <!-- VIEW: COMMISSIONS -->
      <section class="view" id="view-commissions">
        <div class="card">
          <div class="cardHead">
            <div>
              <h2 class="h2">Commissions</h2>
              <div class="muted">Modèles / Textures.</div>
            </div>

            <div class="seg" role="tablist" aria-label="Commissions">
              <button class="segBtn active" type="button" data-comm="models" role="tab" aria-selected="true">Modèles</button>
              <button class="segBtn" type="button" data-comm="textures" role="tab" aria-selected="false">Textures</button>
            </div>
          </div>

          <div class="commissionGrid" id="commissionGrid"></div>
          <div class="empty muted" id="commissionEmpty" hidden>Aucune image.</div>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal (zoom) -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-label="Image">
      <button class="modalClose" id="modalClose" type="button" aria-label="Fermer">✕</button>

      <div class="modalTools" aria-hidden="false">
        <button class="toolBtn" id="zoomOut" type="button" title="Zoom -">−</button>
        <button class="toolBtn" id="zoomReset" type="button" title="Reset">1×</button>
        <button class="toolBtn" id="zoomIn" type="button" title="Zoom +">＋</button>
      </div>

      <div class="modalStage" id="modalStage">
        <img id="modalImg" alt="" />
      </div>

      <div class="modalCaption" id="modalCaption"></div>
    </div>
  </div>

  <div class="toast" id="toast" aria-hidden="true"></div>

  <script src="app.js" defer></script>
</body>
</html>
