
<!-- index.html (Portfolio Roblox - version restaurée + graphique Vente amélioré) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Roblox — Rift of the Guardians</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #1b1f33, #0b0f1f);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }
    header {
      background: rgba(255,255,255,0.05);
      padding: 10px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .tab-container { display: flex; justify-content: center; margin: 20px 0; }
    .tab { padding: 10px 20px; background: rgba(255,255,255,0.1); border-radius: 8px; margin: 0 5px; cursor: pointer; }
    .tab.active { background: #394b9f; }
    .section { display: none; padding: 20px; }
    .section.active { display: block; }

    /* Graphique vente */
    .chart-container {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Portfolio Roblox</h2>
    <nav>
      <div class="tab" data-tab="ugc">UGC</div>
      <div class="tab" data-tab="gallery">Galerie</div>
      <div class="tab active" data-tab="sales">Vente</div>
    </nav>
  </header>

  <main>
    <section id="ugc" class="section">Contenu UGC intact.</section>
    <section id="gallery" class="section">Contenu Galerie intact.</section>

    <section id="sales" class="section active">
      <h3>Vente — Statistiques interactives</h3>
      <div class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </section>
  </main>

  <script>
    // Navigation tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // Données de démonstration (à relier à vos ventes réelles)
    const salesData = {
      labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
      datasets: [
        { label: '[PBR] Golden Sword', data: [3,5,8,10,7,9,11,15,9,6,8,10], borderColor: '#4e73df', tension: 0.3 },
        { label: '[PBR] Royal Crown', data: [2,3,4,6,8,7,9,11,12,10,9,8], borderColor: '#1cc88a', tension: 0.3 },
        { label: 'Flame Wings', data: [1,2,2,3,5,4,6,8,7,6,5,4], borderColor: '#e74a3b', tension: 0.3 }
      ]
    };

    // Graphique interactif
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: salesData,
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#fff' } },
          tooltip: { enabled: true }
        },
        scales: {
          x: { ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y: { ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });
  </script>
</body>
</html>
