
<!-- HOTFIX VERSION -->

<script>
/* ===== GLOBAL SAFETY ===== */
const days = []; // prevents ReferenceError

/* ===== GALLERY FIX ===== */
function renderGallery(items){
  const grid = document.getElementById("galleryGrid");
  if(!grid) return;
  if(!items || !items.length){
    grid.innerHTML = "<div class='empty'>Aucune image.</div>";
    return;
  }
  grid.innerHTML = "";
  items.forEach(it=>{
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = "./" + it.url.replace(/^\/+/, "");
    img.alt = it.caption || "";
    img.style.maxWidth = "100%";
    img.style.borderRadius = "12px";
    const wrap = document.createElement("div");
    wrap.className = "shot";
    wrap.appendChild(img);
    grid.appendChild(wrap);
  });
}

/* ===== SALES FIX ===== */
function buildSales(){
  const listAll = document.getElementById("listAll");
  if(!listAll) return;

  if(!window.SALES_STORE || !Array.isArray(SALES_STORE.items)){
    listAll.innerHTML = "<div class='muted'>Aucun item détecté.</div>";
    return;
  }

  listAll.innerHTML = SALES_STORE.items.map(it=>`
    <div class="row">
      <span>${it.name || "Item"}</span>
      <span>${it.price || "—"} R$</span>
    </div>
  `).join("");
}
</script>
