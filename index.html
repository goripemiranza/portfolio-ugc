<!-- index.html (Sales Dashboard Fixed and Enhanced) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Roblox — Sales Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #1b1f33, #0b0f1f);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #cfd8ff;
    }
    main {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    select {
      background: #1f2339;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 25px 0;
    }
    .stat {
      background: rgba(255, 255, 255, 0.05);
      padding: 18px 25px;
      border-radius: 10px;
      text-align: center;
      flex: 1;
      margin: 0 10px;
    }
    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      margin-top: 25px;
    }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }
    .item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      width: 220px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .item:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <header>
    <div class="title">Portfolio Roblox — Sales</div>
  </header>

  <main>
    <div class="filters">
      <select id="periodSelect">
        <option value="day">Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
      <select id="itemSelect">
        <option value="all">All Items</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat"><strong id="totalSales">0</strong><br/>Total Sales</div>
      <div class="stat"><strong id="periodSales">0</strong><br/>Sales in Period</div>
      <div class="stat"><strong id="uniqueItems">0</strong><br/>Unique Items</div>
    </div>

    <div class="chart-container">
      <canvas id="salesChart"></canvas>
    </div>

    <div class="items" id="itemsContainer"></div>
  </main>

  <script>
    const ctx = document.getElementById('salesChart');

    const sampleData = {
      day: { labels: ['00h', '06h', '12h', '18h'], datasets: [] },
      week: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [] },
      month: { labels: Array.from({length: 30}, (_, i) => `Day ${i+1}`), datasets: [] },
      year: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], datasets: [] }
    };

    const items = [
      { name: '[PBR] Golden and blue celestial sword', sales: 15 },
      { name: '[PBR] Golden green royal crown', sales: 9 },
      { name: 'Blue Dragon Aura', sales: 12 },
      { name: 'Christmas Flame Wings', sales: 8 }
    ];

    function generateChartData(period) {
      const data = sampleData[period];
      data.datasets = items.map(item => ({
        label: item.name,
        data: Array.from({ length: data.labels.length }, () => Math.floor(Math.random() * 10)),
        borderColor: `hsl(${Math.random() * 360}, 70%, 60%)`,
        backgroundColor: 'transparent',
        tension: 0.3
      }));
      return data;
    }

    let chart = new Chart(ctx, {
      type: 'line',
      data: generateChartData('day'),
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#fff' } },
          tooltip: { enabled: true }
        },
        scales: {
          x: { ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y: { ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });

    function updateChart(period) {
      const newData = generateChartData(period);
      chart.data = newData;
      chart.update();
      document.getElementById('totalSales').textContent = items.reduce((a, b) => a + b.sales, 0);
      document.getElementById('periodSales').textContent = Math.floor(Math.random() * 40) + 10;
      document.getElementById('uniqueItems').textContent = items.length;
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';
      items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<strong>${it.name}</strong><br>${it.sales} sales`;
        container.appendChild(div);
      });
    }

    document.getElementById('periodSelect').addEventListener('change', (e) => updateChart(e.target.value));

    updateChart('day');
  </script>
</body>
</html>
