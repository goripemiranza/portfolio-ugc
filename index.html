<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Portfolio Roblox — UGC</title>
  <meta name="description" content="Portfolio Roblox : UGC (profil + groupe), galerie, commissions." />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar card">
      <div class="brand" title="Portfolio">
        <span class="brand-dot" aria-hidden="true"></span>
        <div class="brand-text">
          <div class="brand-title">Portfolio Roblox</div>
          <div class="brand-sub">UGC • Galerie • Commissions</div>
        </div>
      </div>

      <nav class="tabs" aria-label="Navigation">
        <button class="tab-btn active" data-tab="ugc" type="button">UGC</button>
        <button class="tab-btn" data-tab="gallery" type="button">Galerie</button>
        <button class="tab-btn" data-tab="commissions" type="button">Commissions</button>
      </nav>
    </header>

    <main class="main">
      <!-- UGC -->
      <section id="view-ugc" class="view active" aria-label="UGC">
        <div class="podium card">
          <div class="podium-head">
            <h2>Podium</h2>
            <p class="muted">Les 3 derniers UGC en vente.</p>
          </div>
          <div id="podiumGrid" class="podium-grid" aria-label="Podium des 3 derniers UGC"></div>
        </div>

        <div class="controls card">
          <div class="controls-row">
            <div class="control">
              <label for="filterCategory">Catégorie</label>
              <select id="filterCategory">
                <option value="ALL">Tous</option>
                <option value="ACCESSORIES">Accessoires</option>
                <option value="CLOTHING">Vêtements</option>
                <option value="BODY">Corps</option>
                <option value="ANIMATIONS">Animations</option>
              </select>
            </div>

            <div class="control">
              <label for="filterType">Type</label>
              <select id="filterType"></select>
            </div>

            <div class="control">
              <label for="filterSort">Tri</label>
              <select id="filterSort">
                <option value="NEW">Plus récents</option>
                <option value="FAV">Favoris</option>
                <option value="PRICE_DESC">Prix ↓</option>
                <option value="PRICE_ASC">Prix ↑</option>
              </select>
            </div>

            <div class="control control-wide">
              <label for="filterSearch">Recherche</label>
              <input id="filterSearch" type="text" placeholder="Nom / ID..." autocomplete="off" />
            </div>
          </div>
        </div>

        <div class="section-head">
          <h2>Tous les UGC</h2>
          <p id="ugcCount" class="muted">Chargement...</p>
        </div>

        <div id="ugcGrid" class="grid" aria-label="Liste UGC"></div>
      </section>

      <!-- Galerie -->
      <section id="view-gallery" class="view" aria-label="Galerie">
        <div class="section-head">
          <h2>Galerie</h2>
          <p class="muted">Images uniquement.</p>
        </div>
        <div id="galleryGrid" class="grid" aria-label="Images de galerie"></div>
      </section>

      <!-- Commissions -->
      <section id="view-commissions" class="view" aria-label="Commissions">
        <div class="section-head">
          <h2>Commissions</h2>
          <p class="muted">Modèles & textures.</p>
        </div>

        <div class="commission-switch card">
          <button class="pill active" data-comm-view="models" type="button">Modèles</button>
          <button class="pill" data-comm-view="textures" type="button">Textures</button>
        </div>

        <div id="commissionsGrid" class="grid" aria-label="Images commissions"></div>
      </section>
    </main>

    <footer class="footer muted">
      <span id="buildInfo">—</span>
    </footer>
  </div>

  <!-- Zoom modal -->
  <div id="zoom" class="zoom" aria-hidden="true">
    <div class="zoom-backdrop" data-zoom-close></div>
    <div class="zoom-inner card" role="dialog" aria-modal="true" aria-label="Aperçu image">
      <button class="zoom-close" type="button" title="Fermer" data-zoom-close>×</button>
      <img id="zoomImg" class="zoom-img" alt="" />
      <div id="zoomCaption" class="zoom-caption muted"></div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
