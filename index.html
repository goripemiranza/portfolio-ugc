<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio Roblox — lulu8203</title>
  <meta name="description" content="Portfolio Roblox : UGC en vente (profil lulu8203 + groupe Powerful Artists) + galerie d'images." />
  <style>
    :root{
      --bg:#0b0f19; --card:rgba(255,255,255,0.06); --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.66); --line:rgba(255,255,255,0.12);
      --accent:#7c5cff; --accent2:#31d0aa; --shadow:0 14px 40px rgba(0,0,0,0.35);
      --r2:26px; --maxw:1320px;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;color:var(--text);font-family:var(--sans);
      background:
        radial-gradient(1000px 600px at 20% -10%, rgba(124,92,255,0.35), transparent 55%),
        radial-gradient(900px 700px at 80% 0%, rgba(49,208,170,0.25), transparent 60%),
        radial-gradient(900px 700px at 50% 110%, rgba(255,255,255,0.06), transparent 60%),
        var(--bg);
      overflow:hidden; /* ✅ pas de scroll page */
    }
    a{color:inherit;text-decoration:none}
    .wrap{
      max-width:var(--maxw);
      margin:0 auto;
      padding:14px;
      height:100vh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}

    /* Top bar + tabs */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 10px;
      border-radius:18px;
      background:rgba(255,255,255,0.03);
      border:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .brand{display:flex;gap:10px;align-items:center;font-weight:950;letter-spacing:.2px}
    .dot{width:11px;height:11px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 6px rgba(124,92,255,0.15)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{
      padding:9px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,0.04);color:var(--text);
      font-weight:950;font-size:13px;cursor:pointer
    }
    .tab.active{border-color:rgba(124,92,255,0.55);background:linear-gradient(135deg, rgba(124,92,255,0.22), rgba(49,208,170,0.10))}
    .tab:hover{background:rgba(255,255,255,0.07)}

    /* Hero */
    .hero{
      padding:18px 18px 14px;
      position:relative;
      overflow:hidden;
      text-align:center;
    }
    .hero::before{
      content:"";position:absolute;inset:-2px;
      background:
        radial-gradient(800px 260px at 20% 0%, rgba(124,92,255,0.30), transparent 55%),
        radial-gradient(800px 260px at 80% 10%, rgba(49,208,170,0.20), transparent 55%);
      pointer-events:none;
    }
    .hero>*{position:relative}
    .kicker{color:var(--muted);font-size:12px;letter-spacing:.45px;text-transform:uppercase}
    h1{margin:10px 0 10px;font-size:40px;line-height:1.08}
    .subtitle{margin:0 auto 8px;color:var(--muted);font-size:14px;line-height:1.55;max-width:92ch}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      padding:9px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,0.04);color:var(--text);
      font-weight:950;font-size:14px;cursor:pointer
    }
    .btn.primary{border-color:rgba(124,92,255,0.55);background:linear-gradient(135deg, rgba(124,92,255,0.22), rgba(49,208,170,0.10))}
    .btn:hover{background:rgba(255,255,255,0.07)}
    .heroNote{margin:0;color:rgba(255,255,255,0.60);font-size:12px;line-height:1.5}

    /* Views take remaining height */
    .views{flex:1; min-height:0;}
    .view{height:100%; min-height:0; display:none;}
    .view.active{display:block;}

    /* UGC view */
    .dual{
      height:100%;
      min-height:0;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      align-items:stretch;
    }
    .section{
      padding:12px;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .sectionHeader{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
    .sectionHeader h2{margin:0;font-size:16px;letter-spacing:.2px}
    .sectionHeader .meta{margin:0;color:var(--muted);font-size:12px;line-height:1.35;max-width:64ch}
    .status{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;white-space:nowrap}

    /* ✅ Filters (ONLY requested) */
    .filters{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin:0 0 10px;
    }
    .filters .label{
      color:rgba(255,255,255,0.72);
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .control{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:190px;
      flex:1 1 220px;
      max-width:100%;
    }

    select, input[type="text"]{
      border:1px solid var(--line);
      background:rgba(255,255,255,0.04);
      color:var(--text);
      border-radius:14px;
      padding:10px 11px;
      font-weight:950;
      outline:none;
      font-size:13px;
      max-width:100%;
    }
    /* Important: options lisibles dans le dropdown */
    select option{
      color:#e8edf7;
      background:#0b0f17;
    }
    input[type="text"]::placeholder{color:rgba(255,255,255,0.55);font-weight:800}

    .scroller{
      flex:1;
      min-height:0;
      overflow:auto;
      padding-right:6px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
      gap:12px;
    }
    .item{
      background:rgba(255,255,255,0.04);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
      display:flex;
      flex-direction:column;
      min-height:266px;
    }
    .item:hover{transform:translateY(-2px);background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.20)}
    .thumb{
      height:138px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(135deg, rgba(124,92,255,0.10), rgba(49,208,170,0.06));
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      border-radius:12px;
      background:rgba(0,0,0,0.14);
    }
    .badge{
      position:absolute;top:10px;left:10px;font-size:12px;padding:5px 8px;border-radius:999px;
      background:rgba(0,0,0,0.38);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(10px);
      font-weight:950
    }
    .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:7px;flex:1 1 auto}
    .title{font-weight:950;line-height:1.2;font-size:14px}
    .meta2{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .kv{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.72)}
    .date{font-size:11px;color:rgba(255,255,255,0.72)}
    .foot{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:6px}
    .price{font-weight:950;letter-spacing:.2px;font-size:13px}
    .link{
      color:rgba(255,255,255,0.90);
      border:1px solid var(--line);
      background:rgba(255,255,255,0.03);
      padding:7px 10px;
      border-radius:12px;
      font-size:13px;
      font-weight:950
    }
    .link:hover{background:rgba(255,255,255,0.06)}
    .empty{color:var(--muted);font-size:13px;padding:12px}
    .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);border-top-color:rgba(255,255,255,0.85);animation:spin 1s linear infinite;display:inline-block;vertical-align:-3px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Gallery view */
    .gallery{
      height:100%;
      min-height:0;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .galleryHeader{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
    }
    .galleryHeader h2{margin:0;font-size:16px;letter-spacing:.2px}
    .galleryHeader p{margin:0;color:var(--muted);font-size:12px;line-height:1.35;max-width:70ch}
    .galleryTools{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    .galleryTools input{
      min-width:280px;
      flex:1 1 320px;
    }
    .galleryGrid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:12px;
    }
    .shot{
      border:1px solid var(--line);
      background:rgba(255,255,255,0.04);
      border-radius:18px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .shot .imgWrap{
      height:170px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.14);
      padding:10px;
    }
    .shot img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:12px;
      display:block;
      background:rgba(0,0,0,0.10);
    }
    .shot .cap{
      padding:10px;
      color:rgba(255,255,255,0.80);
      font-size:12px;
      line-height:1.35;
      border-top:1px solid var(--line);
      min-height:44px;
    }
    .muted{color:rgba(255,255,255,0.60)}

    footer{color:rgba(255,255,255,0.55);font-size:12px;text-align:center;padding:6px 0 0}

    @media (max-width: 980px){
      body{overflow:hidden}
      .wrap{height:auto}
      .dual{grid-template-columns:1fr; height:auto}
      .views{flex:auto}
      .view{height:auto}
      .scroller{max-height:none; overflow:auto; padding-right:0}
    }
  
    /* ---------- Pretty scrollbars ---------- */
    *{scrollbar-width:thin; scrollbar-color: rgba(255,255,255,0.28) rgba(255,255,255,0.10);}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,0.08); border-radius:999px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.24); border-radius:999px; border:2px solid rgba(0,0,0,0.35)}
    ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.34)}
    ::-webkit-scrollbar-corner{background:transparent}

    /* Keep page fixed: scroll only inside scrollers */
    html, body{height:100%; overflow:hidden}

    /* ---------- Gallery captions: hidden unless hover ---------- */
    .shot{position:relative}
    .shot .cap{
      position:absolute; left:10px; right:10px; bottom:10px;
      padding:10px 12px; border-radius:14px;
      background:linear-gradient(180deg, rgba(0,0,0,0.00), rgba(0,0,0,0.65));
      color:rgba(255,255,255,0.92);
      opacity:0; transform:translateY(6px);
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }
    .shot:hover .cap{opacity:1; transform:translateY(0)}

    /* ---------- Topbar language ---------- */
    .topbar{gap:12px}
    .rightTools{display:flex; align-items:center; gap:10px}
    .langBtn{
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      color:rgba(255,255,255,0.92);
      padding:8px 10px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
      white-space:nowrap;
    }
    .langBtn:hover{transform:translateY(-1px); background:rgba(0,0,0,0.26); border-color:rgba(255,255,255,0.18)}
    .langSelect{
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      color:rgba(255,255,255,0.92);
      padding:8px 10px;
      border-radius:999px;
      font-weight:700;
      outline:none;
    }
    .langSelect option{background:#0b0f17; color:#e8edf7}

  
    /* ---------- Responsive + effects (v18) ---------- */
    body{display:block}
    .wrap{height:calc(var(--vh, 1vh) * 100);}

    .topbar .brand{user-select:none}
    .tab, .btn, .langBtn{
      position:relative;
      overflow:hidden;
    }
    .tab:active, .btn:active, .langBtn:active{transform:translateY(0) scale(0.98)}
    .tab:focus-visible, .btn:focus-visible, .langBtn:focus-visible, select:focus-visible, input:focus-visible{
      outline:2px solid rgba(124,92,255,0.55);
      outline-offset:2px;
    }
    /* subtle shine on hover */
    .btn::after, .tab::after, .langBtn::after{
      content:"";
      position:absolute; inset:-40% -60%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 55%);
      transform:translateX(-30%) rotate(10deg);
      opacity:0;
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }
    .btn:hover::after, .tab:hover::after, .langBtn:hover::after{opacity:1; transform:translateX(0) rotate(10deg)}

    /* language menu */
    .rightTools{position:relative}
    .langMenu{
      position:absolute;
      right:0; top:42px;
      background:rgba(12,16,26,0.92);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;
      padding:10px;
      box-shadow:0 18px 45px rgba(0,0,0,0.45);
      display:none;
      min-width:220px;
      z-index:50;
      backdrop-filter: blur(10px);
    }
    .langMenu.open{display:block}
    .langSelect{width:100%}

    /* scroll reveal */
    .reveal{opacity:0; transform:translateY(10px); transition:opacity .22s ease, transform .22s ease}
    .reveal.in{opacity:1; transform:none}
    @media (prefers-reduced-motion: reduce){
      .reveal{transition:none}
      .btn::after, .tab::after, .langBtn::after{display:none}
    }

    /* Better mobile layout: prevent overlaps */
    @media (max-width: 980px){
      .topbar{flex-wrap:wrap; justify-content:center}
      .brand{flex:1 1 100%; justify-content:center}
      .tabs{flex:1 1 100%; justify-content:center}
      .rightTools{flex:1 1 100%; display:flex; justify-content:center}
      .langMenu{left:50%; right:auto; transform:translateX(-50%); top:44px; width:min(92vw, 360px)}
      h1{font-size:34px}
      .kicker{font-size:12px}
      .actions{flex-wrap:wrap; justify-content:center}
      .dual{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));}
    }

  </style>
</head>
<body>

<script>
  /* ---------- View toggle ---------- */
  const tabUgc = document.getElementById("tabUgc");
  const tabGallery = document.getElementById("tabGallery");
  const viewUgc = document.getElementById("viewUgc");
  const viewGallery = document.getElementById("viewGallery");

  function setActiveView(which){
    const ugc = which === "ugc";
    tabUgc.classList.toggle("active", ugc);
    tabGallery.classList.toggle("active", !ugc);
    viewUgc.classList.toggle("active", ugc);
    viewGallery.classList.toggle("active", !ugc);
  }
  tabUgc.addEventListener("click", ()=> setActiveView("ugc"));
  tabGallery.addEventListener("click", ()=> setActiveView("gallery"));

  /* ---------- UGC rendering ---------- */
  function setStatus(id, text, spinning=false){
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = spinning ? `<span class="spinner"></span><span>${text}</span>` : `<span>${text}</span>`;
  }
  function catalogUrl(assetId){ return `https://www.roblox.com/catalog/${assetId}`; }
  function thumbFallback(assetId){ return `https://www.roblox.com/asset-thumbnail/image?assetId=${assetId}&width=420&height=420&format=png`; }

  function fmtDate(iso){
    if(!iso) return "";
    try{ return new Date(iso).toLocaleDateString("fr-FR"); }catch(e){ return ""; }
  }

  function ugcBadge(typeName){
    const t = String(typeName || "").toLowerCase();
    if(t.includes("back")) return "Dos";
    if(t.includes("waist")) return "Taille";
    if(t.includes("hat") || t.includes("head")) return "Tête";
    if(t.includes("hair")) return "Cheveux";
    if(t.includes("face")) return "Visage";
    if(t.includes("neck")) return "Cou";
    if(t.includes("shoulder")) return "Épaule";
    if(t.includes("front")) return "Avant";
    if(t.includes("shirt")) return "Haut";
    if(t.includes("pants") || t.includes("shorts")) return "Bas";
    if(t.includes("dress") || t.includes("skirt")) return "Robe/Jupe";
    return typeName || "UGC";
  }

  // ✅ Requested accessory type groups: Tête / Corps / Taille (+ Vêtements)
  const TYPE_GROUPS = [
    { label:"Tous", key:"ALL" },
    { label:"Tête", key:"HEAD", badges:["Tête","Cheveux","Visage"] },
    { label:"Corps", key:"BODY", badges:["Cou","Épaule","Avant","Dos"] },
    { label:"Taille", key:"WAIST", badges:["Taille"] },
    { label:"Vêtements", key:"CLOTH", badges:["Haut","Bas","Robe/Jupe"] },
    { label:"Autre", key:"OTHER" }
  ];

  function normalizeItem(x){
    const assetId = (typeof x.assetId === "number") ? x.assetId : (typeof x.id === "number" ? x.id : null);
    const created = x.created || x.createdAt || x.createdUtc || null;
    const createdTs = created ? (Date.parse(created) || null) : null;
    const price = (typeof x.price === "number") ? x.price : (typeof x.priceInRobux === "number" ? x.priceInRobux : null);
    const typeName = x.type || x.assetTypeName || "UGC";
    const name = x.name || `Item ${assetId}`;
    const badge = ugcBadge(typeName);

    return {
      assetId,
      name,
      type: typeName,
      badge,
      price,
      created,
      createdTs,
      thumb: x.thumb || (assetId ? thumbFallback(assetId) : "")
    };
  }

  function applyFilters(items, typeKey, kw){
    const q = String(kw || "").trim().toLowerCase();

    const group = TYPE_GROUPS.find(g => g.key === typeKey) || TYPE_GROUPS[0];

    return items.filter(it => {
      const name = String(it.name || "").toLowerCase();
      const okKw = !q || name.includes(q);

      let okType = true;
      if(group.key === "ALL"){
        okType = true;
      }else if(group.key === "OTHER"){
        const allBadges = new Set(TYPE_GROUPS.filter(g=>Array.isArray(g.badges)).flatMap(g=>g.badges));
        okType = !allBadges.has(it.badge);
      }else{
        okType = Array.isArray(group.badges) ? group.badges.includes(it.badge) : true;
      }

      return okKw && okType;
    });
  }

  function sortByNewest(items){
    const safeTime = (it) => (it.createdTs != null ? it.createdTs : -1);
    return [...items].sort((a,b)=> safeTime(b) - safeTime(a));
  }

  function render(gridId, items, prefix){
    const grid = document.getElementById(gridId);
    if(!grid) return;
    if(!items.length){ grid.innerHTML = `<div class="empty">Aucun UGC en vente trouvé.</div>`; return; }

    grid.innerHTML = items.map(it => {
      const price = (typeof it.price === "number") ? `${it.price} R$` : "—";
      const date = it.created ? fmtDate(it.created) : "";
      const img = it.thumb || thumbFallback(it.assetId);
      const safeTitle = (it.name || "").replaceAll('"', '&quot;');
      return `
        <div class="item" id="${prefix}${it.assetId}">
          <div class="thumb">
            <span class="badge">${it.badge}</span>
            <img loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous"
                 alt="${safeTitle}" src="${img}"
                 onerror="this.onerror=null;this.src='${thumbFallback(it.assetId)}';">
          </div>
          <div class="body">
            <div class="title">${it.name || ""}</div>
            <div class="meta2">
              <span class="kv">Asset ${it.assetId}</span>
              ${date ? `<span class="date">• ${date}</span>` : ""}
            </div>
            <div class="foot">
              <div class="price">${price}</div>
              <a class="link" href="${catalogUrl(it.assetId)}" target="_blank" rel="noopener">Ouvrir</a>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function fetchJsonLocal(path){
    const res = await fetch(`${path}?v=${Date.now()}`, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  function fillTypeSelect(selectId){
    const sel = document.getElementById(selectId);
    sel.innerHTML = TYPE_GROUPS.map(g => `<option value="${g.key}">${g.label}</option>`).join("");
    sel.value = "ALL";
  }

  function wireSection(source, els){
    const state = { items: [] };

    function apply(){
      const typeKey = document.getElementById(els.typeSelId).value;
      const kw = document.getElementById(els.kwId).value;
      const filtered = applyFilters(state.items, typeKey, kw);
      const sorted = sortByNewest(filtered);
      render(els.gridId, sorted, els.itemPrefix);
    }

    async function refresh(){
      setStatus(els.statusId, "Chargement…", true);
      try{
        const payload = await fetchJsonLocal(source.localJson);
        const updated = payload.generatedAt ? new Date(payload.generatedAt).toLocaleString("fr-FR") : "—";

        state.items = (payload.items || []).map(normalizeItem).filter(x => x.assetId != null);

        document.getElementById(els.metaId).innerHTML =
          `${state.items.length} UGC en vente • <span style="color:rgba(255,255,255,0.72)">mise à jour :</span> ${updated}`;

        apply();
        setStatus(els.statusId, `${state.items.length} item(s)`, false);
      }catch(e){
        state.items = [];
        document.getElementById(els.metaId).textContent = t("err_short");
        render(els.gridId, [], els.itemPrefix);
        setStatus(els.statusId, "Erreur", false);
      }
    }

    document.getElementById(els.typeSelId).addEventListener("change", apply);
    document.getElementById(els.kwId).addEventListener("input", apply);

    return { refresh, fill: ()=> fillTypeSelect(els.typeSelId) };
  }

  const userSec = wireSection(
    { localJson: "data_user.json" },
    { statusId:"statusUser", metaId:"metaUser", gridId:"gridUser",
      typeSelId:"typeUser", kwId:"kwUser", itemPrefix:"u-" }
  );

  const groupSec = wireSection(
    { localJson: "data_group.json" },
    { statusId:"statusGroup", metaId:"metaGroup", gridId:"gridGroup",
      typeSelId:"typeGroup", kwId:"kwGroup", itemPrefix:"g-" }
  );

  async function refreshAll(){ await Promise.all([userSec.refresh(), groupSec.refresh()]); }
  document.getElementById("refreshAllBtn").addEventListener("click", refreshAll);

  userSec.fill();
  groupSec.fill();
  refreshAll();

  /* ---------- Gallery (progress images) ----------
     - Lit gallery.json (généré par GitHub Actions à partir du dossier /gallery)
  */
  function setGalleryStatus(text){
    document.getElementById("statusGallery").textContent = text;
  }

  function safeText(s){ return String(s || "").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

  function renderGallery(items){
    const grid = document.getElementById("galleryGrid");
    if(!items.length){
      grid.innerHTML = `<div class="empty">Aucune image pour le moment. Ajoute des fichiers dans <b>gallery/</b> sur GitHub.</div>`;
      return;
    }
    grid.innerHTML = items.map(x => {
      const url = x.url || "";
      const safeUrl = encodeURI(url);
      const cap = x.caption ? safeText(x.caption) : "";
      return `
        <div class="shot">
          <div class="imgWrap">
            <img loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous"
                 src="${safeUrl}" alt="${cap}"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'empty\'>Image invalide</div>';">
          </div>
          <div class="cap">${cap || "<span class='muted'>Sans légende</span>"}</div>
        </div>
      `;
    }).join("");
  }

  async function refreshGallery(){
    setGalleryStatus("Chargement…");
    try{
      const j = await fetchJsonLocal("gallery.json");
      const items = Array.isArray(j) ? j : (Array.isArray(j.items) ? j.items : []);
      const clean = items.filter(x => x && typeof x.url === "string" && x.url.trim());
      renderGallery(clean);
      setGalleryStatus(`${clean.length} image(s)`);
    }catch(e){
      renderGallery([]);
      setGalleryStatus("gallery.json introuvable");
    }
  }

  // charge au clic (et si déjà sur galerie)
  tabGallery.addEventListener("click", refreshGallery);

    document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);

  function t(key){
    const lang = (localStorage.getItem("lang") || "fr");
    return (I18N[lang] && I18N[lang][key]) || (I18N.fr[key] || "");
  }

  function applyLang(lang){
    if(!I18N[lang]) lang = "fr";
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;

    // text nodes
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.getAttribute("data-i18n");
      const v = (I18N[lang] && I18N[lang][k]) || (I18N.fr[k] || null);
      if(v !== null) el.textContent = v;
    });

    // placeholders
    document.querySelectorAll("[data-i18n-ph]").forEach(el => {
      const k = el.getAttribute("data-i18n-ph");
      const v = (I18N[lang] && I18N[lang][k]) || (I18N.fr[k] || null);
      if(v !== null) el.setAttribute("placeholder", v);
    });
  }

  // language menu toggle
  const btnLang = document.getElementById("btnLang");
  const langMenu = document.getElementById("langMenu");
  const langSelect = document.getElementById("langSelect");

  function closeLangMenu(){
    langMenu?.classList.remove("open");
    langMenu?.setAttribute("aria-hidden", "true");
  }
  btnLang?.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = langMenu.classList.toggle("open");
    langMenu.setAttribute("aria-hidden", open ? "false" : "true");
  });
  document.addEventListener("click", closeLangMenu);

  // set initial lang
  const savedLang = localStorage.getItem("lang") || "fr";
  if(langSelect) langSelect.value = savedLang;
  applyLang(savedLang);

  langSelect?.addEventListener("change", (e) => {
    applyLang(e.target.value);
    closeLangMenu();
  });

  /* ---------- Scroll reveal (cards/images appear smoothly) ---------- */
  function setupReveal(rootEl){
    if(!rootEl) return;
    const obs = new IntersectionObserver((entries) => {
      for(const ent of entries){
        if(ent.isIntersecting) ent.target.classList.add("in");
      }
    }, {root: rootEl, threshold: 0.08});
    rootEl.querySelectorAll(".reveal").forEach(el => obs.observe(el));
    // expose helper
    rootEl._revealObserver = obs;
  }
  function addReveal(rootEl, els){
    if(!rootEl || !els) return;
    const obs = rootEl._revealObserver;
    if(!obs) return;
    els.forEach(el => obs.observe(el));
  }
