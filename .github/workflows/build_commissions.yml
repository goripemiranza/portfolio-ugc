name: Build commissions manifest

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "commissions/**"
      - "Commission/**"
      - "commission/**"
      - "build_commissions.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate commissions.json
        run: python build_commissions.py

      - name: Commit & push if changed
        run: |
          git config user.name "commissions-bot"
          git config user.email "commissions-bot@users.noreply.github.com"
          git add commissions.json
          git diff --cached --quiet || (git commit -m "Update commissions" && git pull --rebase origin main && git push)
