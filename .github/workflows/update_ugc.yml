name: Update UGC data

on:
  workflow_dispatch:
  schedule:
    # Auto-update (no manual action needed)
    - cron: "*/15 * * * *"

concurrency:
  group: ugc-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate JSON
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python fetch_ugc.py

      - name: Commit & push if changed
        run: |
          git config user.name "ugc-bot"
          git config user.email "ugc-bot@users.noreply.github.com"
          git add data_user.json data_group.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update UGC data"
            git push
          fi

      # Optional: call Cloudflare dispatch endpoint (email notifications)
      # Works only if you set BOTH GitHub Secrets below.
      - name: Dispatch notifications (optional)
        env:
          NOTIFY_DISPATCH_URL: ${{ secrets.NOTIFY_DISPATCH_URL }}
          NOTIFY_DISPATCH_TOKEN: ${{ secrets.NOTIFY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$NOTIFY_DISPATCH_URL" ] || [ -z "$NOTIFY_DISPATCH_TOKEN" ]; then
            echo "Dispatch secrets not set; skipping."
            exit 0
          fi

          curl -sS -X POST "$NOTIFY_DISPATCH_URL"             -H "Authorization: Bearer $NOTIFY_DISPATCH_TOKEN"             -H "Content-Type: application/json"             --data "{}" || true
