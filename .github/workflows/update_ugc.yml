name: Update UGC data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: ugc-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate JSON
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python fetch_ugc.py

      - name: Commit & push if changed
        run: |
          git config user.name "ugc-bot"
          git config user.email "ugc-bot@users.noreply.github.com"
          git add data_user.json data_group.json
          git diff --cached --quiet || (git commit -m "Update UGC data" && git push)

      - name: Dispatch notifications (optional)
        if: ${{ secrets.NOTIFY_DISPATCH_URL != '' && secrets.NOTIFY_DISPATCH_TOKEN != '' }}
        run: |
          curl -sS -X POST "${{ secrets.NOTIFY_DISPATCH_URL }}"             -H "Authorization: Bearer ${{ secrets.NOTIFY_DISPATCH_TOKEN }}"             -H "Content-Type: application/json"             --data "{}" || true
