name: Build gallery manifest

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "gallery/**"
      - "build_gallery.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate gallery.json
        run: python build_gallery.py

      - name: Commit & push if changed
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || (git commit -m "Update gallery" && git push)
